<header class="top">
  <button appThemeToggle></button>
</header>

<main class="wrap">
  <section class="card enter" aria-labelledby="bo-login-h">
    <bo-brand class="brand" />

    <h1 id="bo-login-h">Ingresá como administrador</h1>
    <p class="lead">Usá tu correo y contraseña de la empresa.</p>

    <form novalidate (submit)="submit($event)">
      <bo-text-field
        label="Correo"
        type="email"
        autocomplete="username"
        placeholder="nombre@empresa.com"
        [required]="true"
        [(value)]="email"
        [error]="emailError()"
      />
      <div class="pw">
        <bo-text-field
          label="Contraseña"
          [type]="showPassword() ? 'text' : 'password'"
          autocomplete="current-password"
          [required]="true"
          [(value)]="password"
          [error]="passwordError()"
        />
        <button mat-button class="bo-sm" type="button" [attr.aria-pressed]="showPassword()" (click)="showPassword.set(!showPassword())">
          {{ showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña' }}
        </button>
      </div>

      @if (formError()) {
        <p class="form-err" role="alert">{{ formError() }}</p>
      }

      <button mat-flat-button [attr.aria-busy]="busy() || null" type="submit" [disabled]="busy()">
        {{ busy() ? 'Ingresando…' : 'Ingresar' }}
      </button>
      <button mat-stroked-button type="button" [disabled]="busy()" (click)="useDemo()">Entrar con datos de ejemplo</button>
    </form>
  </section>
</main>
