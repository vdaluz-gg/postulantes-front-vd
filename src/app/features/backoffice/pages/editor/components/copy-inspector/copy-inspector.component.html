@if (item(); as copy) {
  <app-inspector-head kind="Texto" [title]="copy.label" [dataKey]="copy.id">
    <button mat-icon-button type="button" class="bo-sm" aria-label="Subir en la lista" title="Subir en la lista" [disabled]="position().first" (click)="move(-1)"><svg appIcon="arrowUp"></svg></button>
    <button mat-icon-button type="button" class="bo-sm" aria-label="Bajar en la lista" title="Bajar en la lista" [disabled]="position().last" (click)="move(1)"><svg appIcon="arrowDown"></svg></button>
    <button mat-icon-button type="button" class="bo-sm" aria-label="Borrar el texto" title="Borrar el texto" (click)="remove()"><svg appIcon="trash"></svg></button>
  </app-inspector-head>

  <app-prop-group legend="Texto">
    <bo-text-field
      label="Lo que se lee en el portal"
      [compact]="true"
      [multiline]="copy.multiline"
      [rows]="4"
      [value]="copy.value"
      (valueChange)="set({ value: $event }, 'value')"
    />
    <bo-switch label="Texto largo" help="Varias líneas: por ejemplo, una sugerencia por línea." [checked]="copy.multiline" (checkedChange)="set({ multiline: $event })" />
  </app-prop-group>

  <app-prop-group legend="Para el equipo">
    <bo-text-field label="Nombre interno" help="Cómo aparece en Capas. No se ve en el portal." [compact]="true" [value]="copy.label" (valueChange)="set({ label: $event }, 'label')" />
  </app-prop-group>
}
