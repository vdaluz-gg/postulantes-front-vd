@let a = alert();
<svg [appIcon]="a.level === 'warning' ? 'alert' : a.level === 'positive' ? 'check' : 'bell'"></svg>
<span class="tx">
  <b>
    {{ a.title }}
    @if (!a.active) {
      <span class="flag">Apagado</span>
    }
  </b>
  <span>{{ a.message }}</span>
</span>
@if (a.ctaLabel) {
  <a mat-stroked-button class="cta bo-sm" tabindex="-1" aria-hidden="true">{{ a.ctaLabel }}</a>
}
