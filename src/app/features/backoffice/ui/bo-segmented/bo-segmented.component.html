@for (option of options(); track option.value) {
  <button type="button" [attr.aria-pressed]="option.value === value()" [class.toned]="!!option.color" [style.--tone]="option.color ?? null" (click)="value.set(option.value)">
    @if (option.color) {
      <span class="dot" aria-hidden="true"></span>
    }
    {{ option.label }}
  </button>
}
