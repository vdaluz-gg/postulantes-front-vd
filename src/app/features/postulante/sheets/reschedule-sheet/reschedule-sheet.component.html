@if (interview(); as i) {
  <app-side-sheet heading="Pedir otro horario">
    <p class="mut">
      Elegí la opción que mejor te quede. {{ i.with }} te confirma por correo y WhatsApp, normalmente en menos de 24
      horas.
    </p>

    <fieldset class="slots">
      <legend class="sr">Horarios disponibles</legend>
      @for (slot of slots(); track slot.getTime(); let first = $first) {
        <label class="slot">
          <input
            type="radio"
            name="slot"
            [value]="slot.getTime()"
            [checked]="selected() === slot.getTime()"
            [attr.data-autofocus]="first ? '' : null"
            (change)="selected.set(slot.getTime())"
          />
          <span><b>{{ slot | appDate: 'dayLong' }}</b> · {{ slot | appDate: 'time' }} h</span>
        </label>
      }
    </fieldset>

    <div class="field">
      <label for="why">Motivo (opcional)</label>
      <textarea
        id="why"
        class="inp"
        placeholder="Por ejemplo: ese día trabajo hasta las 11."
        [value]="reason()"
        (input)="onReason($event)"
      ></textarea>
    </div>

    <button sheet-action appButton variant="pri" (click)="submit()">Enviar pedido</button>
    <button sheet-action appButton (click)="cancel()">Cancelar</button>
  </app-side-sheet>
}
