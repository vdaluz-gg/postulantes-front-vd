@for (step of steps(); track step.number) {
  <li class="st" [class]="step.state" [attr.aria-current]="step.state === 'now' ? 'step' : null">
    <span class="dot">
      @switch (step.state) {
        @case ('done') {
          <svg appIcon="check"></svg>
        }
        @case ('bad') {
          <svg appIcon="x"></svg>
        }
        @default {
          {{ step.number }}
        }
      }
    </span>
    <span>{{ step.name }}<span class="sr"> ({{ step.label }})</span></span>
  </li>
}
