<label [for]="inputId()">{{ label() }}</label>
<input
  #control
  class="inp"
  [class.code]="code()"
  [id]="inputId()"
  [type]="type()"
  [value]="value()"
  [placeholder]="placeholder()"
  [required]="required()"
  [attr.autocomplete]="autocomplete()"
  [attr.inputmode]="inputmode()"
  [attr.maxlength]="maxlength()"
  [attr.aria-describedby]="describedBy()"
  (input)="onInput($event)"
/>
<ng-content />
