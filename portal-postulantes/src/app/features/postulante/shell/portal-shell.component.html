<a class="skip" href="#main" (click)="skipToContent($event)">Saltar al contenido</a>
<div class="portal">
  <app-side-nav [badges]="badges()" (logout)="logout()" />
  <div class="main">
    <app-top-bar [name]="store.fullName()" [unread]="store.unreadCount()" />
    <main class="view" id="main" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
@if (sheets.current(); as open) {
  <ng-container *ngComponentOutlet="open.component; inputs: open.inputs" />
}
