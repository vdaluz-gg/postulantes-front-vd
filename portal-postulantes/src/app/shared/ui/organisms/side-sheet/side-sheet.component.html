<div class="sb" [class.re]="replaced()" data-sfx (click)="onBackdrop($event)">
  <aside
    #panel
    class="sheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="sh-t"
    (keydown)="trapFocus($event)"
  >
    <header>
      <h2 id="sh-t">{{ heading() }}</h2>
      <button appIconButton label="Cerrar" (click)="sheet.dismiss()"><svg appIcon="x"></svg></button>
    </header>
    <div #body class="bd2">
      <ng-content />
    </div>
    @if (hasFooter()) {
      <footer>
        <ng-content select="[sheet-action]" />
      </footer>
    }
  </aside>
</div>
